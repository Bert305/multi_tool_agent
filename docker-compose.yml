version: "3.8"

services:
  multi-tool-agent:
    build: .
    container_name: multi-tool-agent
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - PORT=5000
    env_file:
      - backend/.env
    restart: unless-stopped
    volumes:
      - ./backend/.env:/app/backend/.env:ro
    networks:
      - multi-tool-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  multi-tool-network:
    driver: bridge
